name: Checks
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      performance:
        description: Run optional headless performance measurements
        type: boolean
        default: false
defaults:
  run:
    shell: bash
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - run: pacman -Syu --noconfirm rust git gtk4 gtk4-layer-shell pkgconf python zsh labwc dbus niri grim wlr-randr ttf-dejavu adwaita-icon-theme
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: mkdir -p artifacts && scripts/report-environment.sh > artifacts/environment.txt
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --all-targets
      - run: for script in scripts/*.sh packaging/PKGBUILD; do bash -n "$script" || exit; done
      - run: python scripts/test_install.py
      - run: scripts/check-visual.sh
        env:
          CHUHSHELL_VISUAL_ARTIFACTS: ${{ github.workspace }}/artifacts
          CHUHSHELL_VISUAL_BASE: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checks
          path: artifacts
  release:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - run: pacman -Syu --noconfirm rust gtk4 gtk4-layer-shell pkgconf git
      - uses: actions/checkout@v4
      - run: mkdir -p artifacts && scripts/report-environment.sh > artifacts/environment.txt
      - run: cargo build --release --locked
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: |
            target/release/chuhshell
            artifacts/environment.txt
  security:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - run: pacman -Syu --noconfirm rust git cargo-audit
      - uses: actions/checkout@v4
      - run: mkdir -p artifacts && scripts/report-environment.sh > artifacts/environment.txt
      - run: cargo audit --json > artifacts/rustsec.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rustsec
          path: artifacts
  msrv:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - run: pacman -Syu --noconfirm rustup git gtk4 gtk4-layer-shell pkgconf
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.92.0 --profile minimal
      - run: cargo +1.92.0 check --locked --all-targets
  performance:
    if: github.event_name == 'workflow_dispatch' && inputs.performance
    continue-on-error: true
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - run: pacman -Syu --noconfirm rust git gtk4 gtk4-layer-shell pkgconf labwc dbus niri wlr-randr
      - uses: actions/checkout@v4
      - run: mkdir -p artifacts && scripts/report-environment.sh > artifacts/environment.txt
      - run: set -o pipefail; CHUHSHELL_PROFILE=1 CHUHSHELL_TEST_RELEASE=1 scripts/check-headless.sh | tee artifacts/performance.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance
          path: artifacts
