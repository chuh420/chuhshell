[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"

[workspace.dependencies]
platform = { path = "crates/platform" }
ui = { path = "crates/ui" }
services = { path = "crates/services" }
smithay-client-toolkit = { version = "0.21.1", default-features = false, features = ["calloop", "xkbcommon"] }
wayland-client = "0.31.15"
wayland-protocols = { version = "0.32.13", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "0.3.12", features = ["client"] }
calloop = { version = "0.14.5", features = ["signals"] }
calloop-wayland-source = "0.4.1"
tiny-skia = { version = "0.12.0", default-features = false, features = ["std", "simd"] }
cosmic-text = { version = "0.19.0", default-features = false, features = ["std", "swash"] }
resvg = { version = "0.49.0", default-features = false }
jiff = "0.2.38"
log = "0.4.35"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev.package."*"]
opt-level = 2
