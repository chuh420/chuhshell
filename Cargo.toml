[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/chuh420/chuhshell"
description = "A Wayland desktop shell for Hyprland"
publish = false

[workspace.dependencies]
platform = { path = "crates/platform" }
ui = { path = "crates/ui" }
services = { path = "crates/services" }
config = { path = "crates/config" }
smithay-client-toolkit = { version = "0.21.1", default-features = false, features = ["calloop", "xkbcommon"] }
wayland-client = "0.31.15"
wayland-protocols = { version = "0.32.13", features = ["client", "staging", "unstable"] }
wayland-protocols-wlr = { version = "0.3.12", features = ["client"] }
calloop = { version = "0.14.5", features = ["signals", "executor"] }
calloop-wayland-source = "0.4.1"
tiny-skia = { version = "0.12.0", default-features = false, features = ["std", "simd"] }
cosmic-text = { version = "0.19.0", default-features = false, features = ["std", "swash"] }
resvg = { version = "0.49.0", default-features = false }
jiff = "0.2.38"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = { version = "1.1.8", default-features = false, features = ["parse", "serde", "std", "display"] }
pipewire = "0.10.1"
zbus = { version = "6.2.0", default-features = false, features = ["default-rt", "proxy", "service"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "gif"] }
freedesktop-icons = "0.4"
inotify = { version = "0.11.5", default-features = false }
sha2 = { version = "0.11.1", default-features = false }
log = "0.4.35"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev.package."*"]
opt-level = 2
